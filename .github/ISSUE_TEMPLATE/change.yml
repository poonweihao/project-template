name: Change
description: Any code change - feature, fix or chore. This issue is the change record.
title: "<short imperative summary>"
labels: []
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [feat, fix, chore, docs, refactor, test]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem or requirement drives this. This is the field future-you reads.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and explicitly what is out. If this cannot fit one reviewable PR, split it.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How it will be verified
      description: The check that proves it works. If there is no check, there is no definition of done.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: What could break, and how to undo it.
